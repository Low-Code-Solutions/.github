<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 1212 432" width="1212" height="432" role="img" aria-labelledby="title desc">
<title id="title">LCS — Low Code Solutions</title>
<desc id="desc">A maze in LCS teal and grey. A route finds its way through the maze to the LCS mark and out the other side. Disrupting complexity.</desc>
<style>
  .wall { stroke:#585858; stroke-opacity:.32; stroke-width:2.5; stroke-linecap:square; fill:none; }
  .room { stroke:#585858; stroke-opacity:.55; stroke-width:2.5; stroke-linecap:square; fill:none; }
  .route { stroke:#0E8080; stroke-width:6; fill:none; stroke-linejoin:miter; stroke-linecap:square;
           stroke-dasharray:1; stroke-dashoffset:1; animation:draw 2.2s cubic-bezier(.65,0,.35,1) forwards; }
  .comet { stroke:#0E8080; stroke-width:6; fill:none; stroke-linecap:square; opacity:0;
           stroke-dasharray:24 1000; stroke-dashoffset:24; animation:run 7s linear infinite; }
  .m { stroke-dasharray:1; stroke-dashoffset:1; animation:draw .7s ease-out forwards; }
  .m.t { stroke:#0E8080; } .m.g { stroke:#585858; }
  .mdot { fill:#585858; opacity:0; animation:fade .4s ease-out forwards; }
  .txt { opacity:0; animation:fade .9s ease-out forwards; }
  .name { fill:#0E8080; font:800 92px 'Avenir Next','Segoe UI Variable Display','Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing:2px; }
  .full { fill:#585858; font:600 25px 'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif; }
  .tag  { fill:#585858; font:400 19px 'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif; }
  .rule { stroke:#0E8080; stroke-width:4; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes fade { to { opacity:1; } }
  @keyframes run  { 0% { stroke-dashoffset:24; opacity:1; } 100% { stroke-dashoffset:-1000; opacity:1; } }
  @media (prefers-color-scheme: dark) {
    .route,.comet,.m.t,.rule { stroke:#16A6A3; } .name { fill:#16A6A3; }
    .wall,.room,.m.g { stroke:#8B9096; } .mdot,.full,.tag { fill:#8B9096; }
  }
  @media (prefers-reduced-motion: reduce) {
    .route,.m { animation:none; stroke-dashoffset:0; } .mdot,.txt { animation:none; opacity:1; } .comet { display:none; }
  }
</style>
